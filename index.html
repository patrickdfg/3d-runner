<!-- 로우폴리 공중섬 배경의 Three.js 3D 달리기 게임을 구현합니다. -->
<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#182b48"><title>SKY RUNNER · 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7bc5e8;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none;user-select:none}canvas{display:block;position:fixed;inset:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:9px;align-items:flex-start;z-index:2;pointer-events:none}.stat{background:#152b46b9;color:white;border:1px solid #ffffff55;border-radius:15px;padding:8px 14px;box-shadow:0 6px 22px #10264122;backdrop-filter:blur(9px);min-width:84px}.stat small{display:block;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#d5ecf8}.stat b{font-size:23px;font-variant-numeric:tabular-nums}.coin{color:#ffdf60!important}#pause{margin-left:auto;pointer-events:auto;width:44px;height:44px;border-radius:14px;border:1px solid #ffffff80;background:#152b46b9;color:white;font-size:22px}#controls{position:fixed;bottom:max(17px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;z-index:3;pointer-events:none}#controls .cluster{display:flex;gap:8px}.ctrl{pointer-events:auto;width:64px;height:64px;border:2px solid #ffffff99;border-radius:20px;background:#183651a6;color:white;font-size:29px;font-weight:800;box-shadow:0 8px 22px #18365135;backdrop-filter:blur(5px)}.ctrl:active{transform:scale(.94);background:#4c99be}#controls .right{display:flex;gap:8px}.ctrl span{display:block;font-size:10px;line-height:10px}#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#10233b88,#112b45c9);padding:18px}#overlay.hidden{display:none}.panel{width:min(430px,100%);border:1px solid #ffffff90;border-radius:30px;background:linear-gradient(145deg,#fffdf2,#d9f5ff);padding:30px 24px;text-align:center;box-shadow:0 24px 90px #122d4777;color:#163651}.eyebrow{font-weight:900;letter-spacing:3px;color:#159ba4;font-size:13px}.panel h1{font-size:clamp(34px,8vw,52px);line-height:1.03;margin:12px 0 10px;color:#153d61;text-shadow:2px 3px #ffffff}.panel p{font-size:14px;line-height:1.8;margin:10px 0 22px}.primary{border:0;border-radius:17px;background:linear-gradient(110deg,#ff9d36,#ffcc4e);color:#4e310d;font-weight:900;font-size:19px;padding:15px 35px;box-shadow:0 7px 0 #d57b25}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #d57b25}.sub{font-size:12px;color:#58738a;margin-top:20px}.results{display:flex;justify-content:center;gap:20px;font-size:19px;font-weight:800;margin:18px 0}#toast{position:fixed;left:50%;top:25%;transform:translateX(-50%);color:#fff;text-shadow:0 3px 9px #16405b;font-size:27px;font-weight:900;z-index:4;opacity:0;transition:opacity .2s;white-space:nowrap}#toast.show{opacity:1}@media(max-width:420px){.stat{padding:7px 10px;min-width:72px}.stat b{font-size:19px}.ctrl{width:58px;height:60px}#controls .cluster,#controls .right{gap:6px}.panel{padding:26px 18px}}@media(max-height:480px){#controls{bottom:6px}.ctrl{width:50px;height:46px}.panel{padding:12px}.panel h1{font-size:30px}.panel p{margin:5px}}
</style></head><body>
<div id="hud"><div class="stat"><small>DISTANCE</small><b id="distance">0</b></div><div class="stat"><small>COINS</small><b class="coin" id="coins">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><button id="pause" aria-label="일시정지">Ⅱ</button></div>
<div id="toast"></div><div id="controls"><div class="cluster"><button class="ctrl" id="left" aria-label="왼쪽">◀</button><button class="ctrl" id="right" aria-label="오른쪽">▶</button></div><div class="right"><button class="ctrl" id="slide" aria-label="슬라이딩">↓<span>슬라이드</span></button><button class="ctrl" id="jump" aria-label="점프">↑<span>점프</span></button></div></div>
<div id="overlay"><div class="panel"><div class="eyebrow">✦ BLENDER GLB ADVENTURE ✦</div><h1 id="headline">SKY<br>RUNNER</h1><p id="message">구름 위의 길을 달리세요!<br>장애물을 피하고 반짝이는 코인을 모으세요.</p><div id="results" class="results" style="display:none"></div><button class="primary" id="start">게임 시작 ▶</button><div class="sub">PC ← → 이동 · ↑/Space 점프 · ↓ 슬라이드<br>모바일 스와이프 또는 화면 버튼</div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83c9ee);scene.fog=new THREE.FogExp2(0x83c9ee,.014);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,180);camera.position.set(0,5.7,12);camera.lookAt(0,1,-15);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9f7ff,0x53735b,2.3));const sun=new THREE.DirectionalLight(0xfff1c8,3.1);sun.position.set(-12,22,-7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
const mat=(c,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:metal,flatShading:true});
const materials={grass:mat(0x8fd45b),grass2:mat(0xa6e16b),soil:mat(0x9e634a),soil2:mat(0x704c4c),road:mat(0xf5d8a0),road2:mat(0xffe5ad),tree:mat(0x9a6448),leaf:mat(0xff9b4d),leaf2:mat(0xe97285),leaf3:mat(0x8b7bd4),white:mat(0xffffff),gold:mat(0xffd54e,.35),goldSide:mat(0xffa52e,.35),red:mat(0xe96063),blue:mat(0x4b9bd5),stone:mat(0x78869c)};
function mesh(geo,material,parent=scene){const o=new THREE.Mesh(geo,material);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cube(w,h,d,m,parent,x=0,y=0,z=0){const o=mesh(new THREE.BoxGeometry(w,h,d),m,parent);o.position.set(x,y,z);return o}
function poly(r,h,m,parent,x=0,y=0,z=0,sides=6){const o=mesh(new THREE.CylinderGeometry(r*.82,r,h,sides),m,parent);o.position.set(x,y,z);return o}
function tree(parent,x,z,color){const g=new THREE.Group();parent.add(g);g.position.set(x,0,z);poly(.15,1.7,materials.tree,g,0,1,0,5);const top=mesh(new THREE.IcosahedronGeometry(.85,0),color,g);top.position.set(0,2.15,0);const small=mesh(new THREE.IcosahedronGeometry(.52,0),color,g);small.position.set(.45,2.35,.2);return g}
const tiles=[];const TILE=12,COUNT=13;function makeTile(i){const g=new THREE.Group();scene.add(g);g.position.z=8-i*TILE;const green=i%2?materials.grass:materials.grass2;cube(12,.7,TILE,materials.soil,g,0,-.7,0);cube(12,.5,TILE,green,g,0,-.15,0);cube(7,.12,TILE, i%2?materials.road:materials.road2,g,0,.15,0);for(const x of [-1.17,1.17]){for(let z=-4;z<6;z+=4)cube(.11,.03,1.6,materials.white,g,x,.23,z)}for(const x of [-5.1,5.1]){if(i%3!==0){tree(g,x,-2.5,[materials.leaf,materials.leaf2,materials.leaf3][(i+Math.round(x))%3+((i+Math.round(x))%3<0?3:0)]);const stone=mesh(new THREE.DodecahedronGeometry(.37,0),materials.stone,g);stone.position.set(x+(x>0?-.5:.5),.35,3)}}tiles.push(g)}for(let i=0;i<COUNT;i++)makeTile(i);
const clouds=[];for(let i=0;i<22;i++){const g=new THREE.Group();scene.add(g);for(let j=0;j<3;j++){const o=mesh(new THREE.IcosahedronGeometry(1.6+j*.3,0),mat(0xf5fcff),g);o.position.set(j*1.7,Math.sin(j)*.3,0);o.castShadow=false}g.position.set((i%2?1:-1)*(13+i%4*4),-4-(i%3),-i*10);clouds.push(g)}
const runner=new THREE.Group();scene.add(runner);const body=new THREE.Group();runner.add(body);
const skin=mat(0xffd2a3),hair=mat(0x304b87),shirt=mat(0xffb83e),pants=mat(0x3374bb),shoes=mat(0xfef7ec),eyes=mat(0x24344c);
cube(.85,.9,.48,shirt,body,0,1.35,0);cube(.68,.68,.62,skin,body,0,2.17,0);cube(.75,.22,.7,hair,body,0,2.56,-.03);for(let i=-1;i<=1;i++){const spike=mesh(new THREE.ConeGeometry(.22,.55,5),hair,body);spike.position.set(i*.24,2.76,-.07);spike.rotation.z=-.25}for(const x of [-.18,.18])cube(.1,.14,.055,eyes,body,x,2.2,.33);
const leftArm=new THREE.Group(),rightArm=new THREE.Group(),leftLeg=new THREE.Group(),rightLeg=new THREE.Group();body.add(leftArm,rightArm,leftLeg,rightLeg);leftArm.position.set(-.56,1.65,0);rightArm.position.set(.56,1.65,0);leftLeg.position.set(-.23,.93,0);rightLeg.position.set(.23,.93,0);cube(.24,.72,.27,shirt,leftArm,0,-.34,0);cube(.24,.72,.27,shirt,rightArm,0,-.34,0);cube(.23,.2,.24,skin,leftArm,0,-.76,0);cube(.23,.2,.24,skin,rightArm,0,-.76,0);cube(.32,.76,.32,pants,leftLeg,0,-.36,0);cube(.32,.76,.32,pants,rightLeg,0,-.36,0);cube(.37,.18,.56,shoes,leftLeg,0,-.79,.13);cube(.37,.18,.56,shoes,rightLeg,0,-.79,.13);
// Blender에서 편집 가능한 GLB 캐릭터를 우선 사용하고 실패하면 기존 캐릭터로 돌아갑니다.
let glbAvatar=null,glbLimbs=null;
new GLTFLoader().load('./assets/runner.glb',gltf=>{
  const model=gltf.scene;
  model.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true}});
  runner.add(model);
  glbAvatar=model;
  glbLimbs={
    leftArm:model.getObjectByName('LeftArm'),
    rightArm:model.getObjectByName('RightArm'),
    leftLeg:model.getObjectByName('LeftLeg'),
    rightLeg:model.getObjectByName('RightLeg')
  };
  body.visible=false;
},undefined,error=>console.warn('GLB 로드 실패: 기본 캐릭터를 사용합니다.',error));
const shadow=mesh(new THREE.CircleGeometry(.62,20),new THREE.MeshBasicMaterial({color:0x35422a,transparent:true,opacity:.23,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.245,0);shadow.castShadow=false;
const items=[];const lanes=[-2.3,0,2.3];let lane=1,y=0,vy=0,slideTime=0,runTime=0,travel=0,coins=0,speed=12,spawnAt=24,state='menu',best=0,toastTime=0;
try{best=Number(localStorage.getItem('sky-runner-best'))||0}catch(e){}$('best').textContent=best;
function obstacle(type,l,z){const g=new THREE.Group();scene.add(g);g.position.set(lanes[l],0,z);if(type==='rock'){const o=mesh(new THREE.DodecahedronGeometry(.83,0),materials.stone,g);o.position.y=.85;const edge=mesh(new THREE.DodecahedronGeometry(.35,0),materials.blue,g);edge.position.set(.35,1.2,.35)}else if(type==='bar'){for(const x of [-.72,.72])cube(.18,1.8,.2,materials.red,g,x,.9,0);cube(1.75,.34,.25,materials.red,g,0,1.75,0)}else if(type==='coin'){const c=mesh(new THREE.TorusGeometry(.45,.16,6,9),materials.gold,g);c.position.y=1.35;const core=mesh(new THREE.CylinderGeometry(.32,.32,.09,9),materials.goldSide,g);core.rotation.x=Math.PI/2;core.position.y=1.35}items.push({group:g,type,lane:l,hit:false})}
function spawn(){const l=Math.floor(Math.random()*3);const t=Math.random()<.23?'bar':'rock';obstacle(t,l,-105);const coinLane=Math.random()<.55?((l+1+Math.floor(Math.random()*2))%3):l;for(let i=0;i<3;i++)obstacle('coin',coinLane,-113-i*2.2)}
function clearItems(){for(const o of items)o.group.removeFromParent();items.length=0}
function showToast(s){$('toast').textContent=s;$('toast').classList.add('show');toastTime=.8}
function updateHUD(){$('distance').textContent=Math.floor(travel);$('coins').textContent=coins;$('best').textContent=best}
function showPanel(title,msg,button){$('headline').innerHTML=title;$('message').innerHTML=msg;$('start').textContent=button;$('overlay').classList.remove('hidden')}
function start(){clearItems();lane=1;y=0;vy=0;slideTime=0;runTime=0;travel=0;coins=0;speed=12;spawnAt=32;state='playing';$('overlay').classList.add('hidden');$('results').style.display='none';$('pause').textContent='Ⅱ';updateHUD()}
function finish(){state='over';const score=Math.floor(travel);if(score>best){best=score;try{localStorage.setItem('sky-runner-best',String(best))}catch(e){}}updateHUD();$('results').style.display='flex';$('results').innerHTML='<div>🏁 '+score+'m</div><div>🪙 '+coins+'</div>';showPanel('GAME<br>OVER','장애물에 부딪혔어요! 다시 도전해 보세요.','다시 달리기 ↻')}
function pause(){if(state==='playing'){state='paused';showPanel('PAUSED','잠시 쉬어가세요.','계속 달리기 ▶');$('pause').textContent='▶'}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ'}}
function move(d){if(state==='playing')lane=Math.max(0,Math.min(2,lane+d))}
function jump(){if(state==='playing'&&y===0&&slideTime<=0){vy=9.2}}
function slide(){if(state==='playing'&&y===0)slideTime=.72}
$('start').addEventListener('click',()=>state==='paused'?pause():start());$('pause').addEventListener('click',pause);
for(const [id,fn] of [['left',()=>move(-1)],['right',()=>move(1)],['jump',jump],['slide',slide]])$(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(['ArrowUp','Space','KeyW'].includes(e.code))jump();if(['ArrowDown','KeyS'].includes(e.code))slide();if(e.code==='KeyP'||e.code==='Escape')pause();if(e.code==='Enter'&&(state==='menu'||state==='over'))start()});
let touch=null;renderer.domElement.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.abs(dx)<30&&Math.abs(dy)<30)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else slide()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
const clock=new THREE.Clock();function tick(){const dt=Math.min(clock.getDelta(),.045);if(state==='playing'){runTime+=dt;speed=Math.min(27,12+travel/125);travel+=speed*dt;spawnAt-=speed*dt;if(spawnAt<=0){spawn();spawnAt=16+Math.random()*7}vy-=24*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0;slideTime=Math.max(0,slideTime-dt);
runner.position.x=THREE.MathUtils.damp(runner.position.x,lanes[lane],13,dt);runner.position.y=y;runner.rotation.z=THREE.MathUtils.damp(runner.rotation.z,(lanes[lane]-runner.position.x)*-.07,6,dt);
body.scale.y=THREE.MathUtils.damp(body.scale.y,slideTime>0?.55:1,14,dt);body.position.y=slideTime>0?-.02:Math.sin(runTime*14)*.055;
const swing=Math.sin(runTime*15)*.65;
if(glbAvatar){
  glbAvatar.scale.y=THREE.MathUtils.damp(glbAvatar.scale.y,slideTime>0?.55:1,14,dt);
  glbAvatar.position.y=slideTime>0?-.02:Math.sin(runTime*14)*.055;
  if(glbLimbs.leftLeg)glbLimbs.leftLeg.rotation.x=swing;
  if(glbLimbs.rightLeg)glbLimbs.rightLeg.rotation.x=-swing;
  if(glbLimbs.leftArm)glbLimbs.leftArm.rotation.x=-swing;
  if(glbLimbs.rightArm)glbLimbs.rightArm.rotation.x=swing;
}else{
  leftLeg.rotation.x=swing;rightLeg.rotation.x=-swing;
  leftArm.rotation.x=-swing;rightArm.rotation.x=swing;
}shadow.position.x=runner.position.x;shadow.material.opacity=.22/(1+y*.6);
for(const t of tiles){t.position.z+=speed*dt;if(t.position.z>20)t.position.z-=COUNT*TILE}
for(const c of clouds){c.position.z+=speed*dt*.32;if(c.position.z>28)c.position.z-=220}
for(let i=items.length-1;i>=0;i--){const o=items[i];o.group.position.z+=speed*dt;if(o.type==='coin'){o.group.rotation.y+=dt*4;o.group.position.y=Math.sin(runTime*5+i)*.13}if(!o.hit&&Math.abs(o.group.position.z)<.85&&Math.abs(runner.position.x-lanes[o.lane])<.85){if(o.type==='coin'){o.hit=true;coins++;showToast('+1 🪙');o.group.visible=false}else if(o.type==='rock'&&y<1.12||o.type==='bar'&&slideTime<=0){finish();break}}if(o.group.position.z>19){o.group.removeFromParent();items.splice(i,1)}}
camera.position.x=THREE.MathUtils.damp(camera.position.x,runner.position.x*.19,2.4,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,5.5+y*.15,2.5,dt);camera.lookAt(runner.position.x*.22,1.3,-15);updateHUD()}
if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('show')}renderer.render(scene,camera)}
renderer.setAnimationLoop(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
