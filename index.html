<!-- Three.js 3D 달리기 게임의 첫 단계 화면과 조작을 구현합니다. -->
<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D Runner</title><style>html,body{margin:0;overflow:hidden;background:#87c9ee;font-family:system-ui}canvas{display:block}#hud{position:absolute;top:16px;left:16px;color:white;text-shadow:0 2px 5px #234;font-weight:800;font-size:22px}#help{position:absolute;top:16px;right:12px;color:white;text-shadow:0 2px 5px #234;font-size:13px;text-align:right}#controls{position:absolute;bottom:25px;width:100%;display:flex;justify-content:space-between;pointer-events:none}button{pointer-events:auto;background:#ffffffa8;border:2px solid white;border-radius:18px;font-size:27px;width:66px;height:66px;margin:8px;touch-action:none}#leftButtons{display:flex}</style></head><body><div id="hud">3D RUNNER · 1단계</div><div id="help">← → 이동 / Space 점프<br>모바일 스와이프 또는 버튼</div><div id="controls"><div id="leftButtons"><button id="left">◀</button><button id="right">▶</button></div><button id="jump">↑</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ed3f4);scene.fog=new THREE.Fog(0x8ed3f4,25,95);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);camera.position.set(0,5.5,11);camera.lookAt(0,1,-12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x597a55,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-5,12,7);sun.castShadow=true;scene.add(sun);
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
box(12,.3,180,0x5c9c65,0,-.22,-55);box(7,.12,180,0x444d5a,0,-.03,-55);
const stripes=[];for(let z=-100;z<18;z+=8){for(let x of [-1.17,1.17])stripes.push(box(.09,.025,3.4,0xf6f2d9,x,.05,z))}
const player=new THREE.Group();scene.add(player);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.65});function part(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;player.add(m);return m}part(.85,1,.48,0x1b82bc,0,1.25,0);part(.62,.62,.6,0xffcf9e,0,2.12,0);part(.7,.2,.67,0x293d65,0,2.49,0);const armL=part(.22,.85,.25,0xffcf9e,-.58,1.24,0),armR=part(.22,.85,.25,0xffcf9e,.58,1.24,0);const legL=part(.28,.85,.3,0x243d68,-.22,.43,0),legR=part(.28,.85,.3,0x243d68,.22,.43,0);
let lane=1,velocity=0,jumpY=0,elapsed=0;function move(n){lane=Math.max(0,Math.min(2,lane+n))}function jump(){if(jumpY===0)velocity=8}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(['Space','ArrowUp','KeyW'].includes(e.code))jump()});for(const [id,fn] of [['left',()=>move(-1)],['right',()=>move(1)],['jump',jump]])document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()});let start=null;renderer.domElement.addEventListener('touchstart',e=>{start=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});renderer.domElement.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start[0],dy=e.changedTouches[0].clientY-start[1];if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy< -35)jump();start=null},{passive:true});
const clock=new THREE.Clock();function animate(){const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;velocity-=21*dt;jumpY=Math.max(0,jumpY+velocity*dt);if(jumpY===0)velocity=0;player.position.x=THREE.MathUtils.damp(player.position.x,(lane-1)*2.3,12,dt);player.position.y=jumpY;const swing=Math.sin(elapsed*12)*.6*(jumpY===0?1:.25);legL.rotation.x=swing;legR.rotation.x=-swing;armL.rotation.x=-swing;armR.rotation.x=swing;for(const s of stripes){s.position.z+=dt*12;if(s.position.z>17)s.position.z-=120}renderer.render(scene,camera)}renderer.setAnimationLoop(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
